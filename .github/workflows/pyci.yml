name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-python не нужен: версию питона держит .python-version, и uv сам
      # ставит её при первом `uv sync`. Единый источник версии, поэтому раннер
      # и образ кита не могут разойтись.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install
        run: make install
      - name: Run linter
        run: make lint

      # Тесты в CI не гоняются: они поднимают настоящий Chrome и ходят на
      # the-internet.herokuapp.com, то есть падение означало бы недоступность
      # чужого сайта, а не поломку примера. Прогоняются локально: make test.
