[project]
authors = [
    {name = "Hexlet team", email = "team@hexlet.io"},
]
requires-python = ">=3.14"
name = "python-example-app"
version = "0.1.0"
description = "Example application"
readme = "README.md"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "selenium>=4.46.0",
    "allure-pytest>=2.16.0",
]

# Это демо-приложение, а не пакет: устанавливать его нечем и незачем, а
# hatch-конфиг ссылался на каталог python_selenium_example, которого в
# репозитории нет.
[tool.uv]
package = false
