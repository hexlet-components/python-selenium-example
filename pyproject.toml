[project]
authors = [
    {name = "Hexlet team", email = "team@hexlet.io"},
]
requires-python = "<4.0,>=3.12"
name = "python-example-app"
version = "0.1.0"
description = "Example application"
readme = "README.md"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "selenium>=4.46.0",
    "allure-pytest>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "examples" = "python_selenium_example/examples" }
